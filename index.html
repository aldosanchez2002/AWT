<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness & Diet Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        primaryHover: '#4338ca',
                        negative: '#f43f5e',
                        negativeHover: '#e11d48'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased p-4 md:p-8 relative">

    <div id="toast" role="status" aria-live="polite" class="hidden fixed top-4 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-6 py-3 rounded-lg shadow-lg z-50 transition-opacity font-medium"></div>

    <main class="max-w-xl mx-auto space-y-6 mt-4">
        <!-- Sleep Tracking Section -->
        <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <h2 class="text-lg font-semibold text-slate-800 mb-4">Sleep Tracking</h2>
            <div class="flex items-center gap-3">
                <label class="text-sm font-medium text-slate-700 whitespace-nowrap">Hours slept</label>
                <input type="number" id="sleepInput" min="0" max="24" step="0.1" placeholder="e.g. 7.5" aria-label="Hours slept" class="w-20 p-2 border border-slate-300 rounded-lg bg-slate-50 text-center focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="saveSleepLog()" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-lg transition-colors">Save</button>
            </div>
        </section>

        <!-- Weight Tracking Section -->
        <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <h2 class="text-lg font-semibold text-slate-800 mb-4">Daily Weigh-In</h2>
            <div class="flex items-center gap-3">
                <label class="text-sm font-medium text-slate-700 whitespace-nowrap">Weight (lbs)</label>
                <input type="number" id="weightInput" min="0" step="0.1" placeholder="e.g. 175.5" aria-label="Weight in lbs" class="w-24 p-2 border border-slate-300 rounded-lg bg-slate-50 text-center focus:outline-none focus:ring-2 focus:ring-purple-500">
                <button onclick="saveWeightLog()" class="flex-1 bg-purple-500 hover:bg-purple-600 text-white font-medium py-2 px-4 rounded-lg transition-colors">Save</button>
            </div>
        </section>

        <!-- Diet Section -->
        <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <h2 class="text-lg font-semibold text-slate-800 mb-4">Diet Control</h2>
            <button onclick="openDietModal()" class="w-full bg-negative hover:bg-negativeHover text-white font-medium py-3 rounded-lg transition-colors">
                Add Diet Break
            </button>
        </section>

        <!-- Workouts Section -->
        <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-5">
            <h2 class="text-lg font-semibold text-slate-800 border-b border-slate-100 pb-2">Workouts</h2>
            <div id="workout-container" class="space-y-4"></div>
            <button onclick="saveWorkoutSession()" class="w-full bg-primary hover:bg-primaryHover text-white font-medium py-3 rounded-lg transition-colors mt-4">
                Save Daily Workout
            </button>
        </section>

        <!-- Calendar Section -->
        <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <button onclick="changeMonth(-1)" aria-label="Previous month" class="p-1.5 hover:bg-slate-100 rounded text-slate-600 transition-colors">&larr;</button>
                    <h2 class="text-lg font-semibold text-slate-800 w-32 text-center" id="calendarMonthLabel">Calendar</h2>
                    <button onclick="changeMonth(1)" aria-label="Next month" class="p-1.5 hover:bg-slate-100 rounded text-slate-600 transition-colors">&rarr;</button>
                </div>
                <button onclick="resetCalendar()" class="text-xs text-slate-500 hover:text-slate-800 underline">Today</button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-slate-500 mb-2">
                <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
            <div class="flex gap-4 mt-4 text-xs text-slate-500 justify-center flex-wrap">
                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-slate-100 border border-slate-200"></span> No Workout</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-emerald-100 border border-emerald-300"></span> Workout</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-negative"></span> Diet Break</span>
                <span class="flex items-center gap-1"><span class="text-[8px] text-blue-600 font-semibold">7.5</span> Sleep hrs</span>
                <span class="flex items-center gap-1"><span class="text-[8px] text-purple-600 font-semibold">175</span> Weight lbs</span>
            </div>
        </section>

        <!-- Monthly Summary (Lightened and Mobile Friendly) -->
        <section class="bg-white p-5 rounded-xl border border-indigo-100 shadow-sm">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-indigo-900">Monthly Summary</h2>
                <span class="text-[10px] bg-indigo-50 text-indigo-600 px-2 py-1 rounded-md uppercase tracking-wider font-bold border border-indigo-100" id="statsMonthLabel">Month Year</span>
            </div>
            <div id="monthlyStatsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <!-- Monthly totals dynamically populated -->
            </div>
        </section>

        <!-- History Section -->
        <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <h2 class="text-lg font-semibold text-slate-800 border-b border-slate-100 pb-2 mb-4">History Log</h2>
            <ul id="historyList" class="space-y-3 max-h-64 overflow-y-auto text-sm text-slate-600"></ul>
        </section>
    </main>

    <div id="dietModal" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-40">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm shadow-xl">
            <h3 class="text-lg font-bold mb-2">Log Diet Break</h3>
            <p class="text-sm text-slate-500 mb-4">What did you eat?</p>
            <textarea id="dietDesc" maxlength="500" class="w-full border border-slate-300 p-3 rounded-lg mb-4 focus:ring-2 focus:ring-negative focus:outline-none" rows="3" placeholder="e.g. pizza..."></textarea>
            <div class="flex justify-end gap-3">
                <button onclick="closeDietModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Cancel</button>
                <button onclick="saveDietBreak()" class="px-4 py-2 bg-negative hover:bg-negativeHover text-white rounded-lg transition-colors">Save</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const userFirebaseConfig = {
            apiKey: "AIzaSyD2tz4O41nHGlWii8tJJk9mDnwlWz7s4WI",
            authDomain: "workouttrackeraldo.firebaseapp.com",
            projectId: "workouttrackeraldo",
            storageBucket: "workouttrackeraldo.firebasestorage.app",
            messagingSenderId: "968007814743",
            appId: "1:968007814743:web:fa4ff9fb92b287c2549d12"
        };

        const app = !getApps().length ? initializeApp(userFirebaseConfig) : getApp();
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        const workouts = [
            { id: 'pushups', name: 'Pushups', type: 'single', unit: 'reps' },
            { id: 'running', name: 'Running', type: 'single', unit: 'miles' },
            { id: 'bicepCurls', name: 'Bicep Curls', type: 'double' },
            { id: 'benchPress', name: 'Bench Press', type: 'double' },
            { id: 'squats', name: 'Squats', type: 'double' }
        ];

        let currentCalendarDate = new Date();
        let currentLogs = [];

        const getLogDate = (ts) => {
            if (!ts) return new Date();
            if (typeof ts.toDate === 'function') return ts.toDate();
            if (typeof ts.seconds === 'number') return new Date(ts.seconds * 1000);
            return (typeof ts === 'number' || typeof ts === 'string') ? new Date(ts) : new Date();
        };

        const getMillis = (ts) => {
            if (!ts) return Date.now();
            if (typeof ts.toMillis === 'function') return ts.toMillis();
            if (typeof ts.seconds === 'number') return ts.seconds * 1000;
            return (typeof ts === 'number' || typeof ts === 'string') ? new Date(ts).getTime() : Date.now();
        };

        const escapeHtml = (str) => {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        };

        function initUI() {
            const container = document.getElementById('workout-container');
            container.innerHTML = workouts.map(w => {
                const inputsHtml = w.type === 'single'
                    ? `<input type="number" id="input-${w.id}" min="0" step="any" placeholder="${w.unit}" class="w-full sm:w-24 p-2 border border-slate-300 rounded-lg bg-slate-50 text-center focus:outline-none focus:ring-2 focus:ring-primary">`
                    : `<div class="flex gap-2 w-full sm:w-auto">
                        <input type="number" id="weight-${w.id}" min="0" step="any" placeholder="lbs" class="w-full sm:w-16 p-2 border border-slate-300 rounded-lg bg-slate-50 text-center focus:outline-none focus:ring-2 focus:ring-primary">
                        <input type="number" id="reps-${w.id}" min="0" step="1" placeholder="reps" class="w-full sm:w-16 p-2 border border-slate-300 rounded-lg bg-slate-50 text-center focus:outline-none focus:ring-2 focus:ring-primary">
                       </div>`;
                return `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 sm:gap-4 border-b border-slate-50 pb-2">
                        <h3 class="font-medium text-slate-800 text-sm sm:text-base">${w.name}</h3>
                        <div class="flex items-center gap-2">${inputsHtml}</div>
                    </div>`;
            }).join('');
            renderCalendar([]);
        }

        function updateMonthlySummary(logs) {
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            const grid = document.getElementById('monthlyStatsGrid');
            const label = document.getElementById('statsMonthLabel');

            label.innerText = new Intl.DateTimeFormat('en-US', { month: 'short', year: 'numeric' }).format(currentCalendarDate);

            let monthlyTotals = {
                diet: 0,
                wk: { pushups: 0, running: 0, bicepCurls: 0, benchPress: 0, squats: 0 },
                sleepTotal: 0, sleepCount: 0,
                weightTotal: 0, weightCount: 0
            };

            logs.forEach(log => {
                const date = getLogDate(log.timestamp);
                if (date.getFullYear() === year && date.getMonth() === month) {
                    if (log.type === 'diet') monthlyTotals.diet++;
                    else if (log.type === 'workout_session') {
                        (log.exercises || []).forEach(ex => {
                            if (monthlyTotals.wk[ex.id] !== undefined) {
                                monthlyTotals.wk[ex.id] += (ex.weight ? ex.reps : ex.value);
                            }
                        });
                    } else if (log.type === 'sleep') {
                        monthlyTotals.sleepTotal += log.hours;
                        monthlyTotals.sleepCount++;
                    } else if (log.type === 'weight') {
                        monthlyTotals.weightTotal += log.weight;
                        monthlyTotals.weightCount++;
                    }
                }
            });

            const renderStat = (label, val, unit) => `
                <div class="bg-slate-50 p-2 rounded-lg border border-slate-100 flex flex-col justify-center">
                    <p class="text-[9px] uppercase font-bold text-slate-400 leading-tight">${label}</p>
                    <p class="text-base sm:text-lg font-black text-slate-800">${val}<span class="text-[10px] ml-0.5 font-normal text-slate-500">${unit}</span></p>
                </div>
            `;

            const avgSleep = monthlyTotals.sleepCount ? (monthlyTotals.sleepTotal / monthlyTotals.sleepCount).toFixed(1) : '—';
            const avgWeight = monthlyTotals.weightCount ? (monthlyTotals.weightTotal / monthlyTotals.weightCount).toFixed(1) : '—';

            let html = renderStat('Diet Breaks', monthlyTotals.diet, '');
            workouts.forEach(w => {
                html += renderStat(w.name, monthlyTotals.wk[w.id].toFixed(w.id === 'running' ? 1 : 0), w.type === 'single' ? w.unit : 'reps');
            });
            html += renderStat('Avg Sleep', avgSleep, monthlyTotals.sleepCount ? 'hrs' : '');
            html += renderStat('Avg Weight', avgWeight, monthlyTotals.weightCount ? 'lbs' : '');
            grid.innerHTML = html;
        }

        let unsubscribers = [];

        function setupRealtimeLogs() {
            unsubscribers.forEach(fn => fn());
            unsubscribers = [];

            let dietLogs = [], workoutLogs = [], legacyLogs = [], sleepLogs = [], weightLogs = [];
            const refresh = () => {
                currentLogs = [...dietLogs, ...workoutLogs, ...legacyLogs, ...sleepLogs, ...weightLogs].sort((a, b) => getMillis(b.timestamp) - getMillis(a.timestamp));
                renderCalendar(currentLogs);
                updateMonthlySummary(currentLogs);

                const list = document.getElementById('historyList');
                if (!currentLogs.length) {
                    list.innerHTML = '<li class="text-slate-400 italic">No history logged yet.</li>';
                    return;
                }
                list.innerHTML = currentLogs.slice(0, 50).map(log => {
                    const date = getLogDate(log.timestamp).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    let text;
                    if (log.type === 'diet') {
                        text = `<span class="text-negative font-medium">Diet Break:</span> ${escapeHtml(log.description)}`;
                    } else if (log.type === 'sleep') {
                        text = `<span class="text-blue-500 font-medium">Sleep:</span> ${log.hours} hrs`;
                    } else if (log.type === 'weight') {
                        text = `<span class="text-purple-500 font-medium">Weight:</span> ${log.weight} lbs`;
                    } else {
                        text = `<span class="text-primary font-medium">Workout:</span> ${(log.exercises || []).map(e => e.weight ? `${escapeHtml(e.name)} (${e.weight}lbs x ${e.reps})` : `${escapeHtml(e.name)} (${e.value}${e.unit})`).join(', ')}`;
                    }
                    return `<li class="p-3 bg-slate-50 rounded-lg border border-slate-100 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1"><div class="flex-1 text-xs sm:text-sm">${text}</div><div class="text-[10px] text-slate-400 whitespace-nowrap">${date}</div></li>`;
                }).join('');
            };

            unsubscribers.push(onSnapshot(collection(db, 'diet_breaks'), s => { dietLogs = s.docs.map(d => ({id: d.id, type: 'diet', ...d.data()})); refresh(); }));
            unsubscribers.push(onSnapshot(collection(db, 'workouts'), s => { workoutLogs = s.docs.map(d => ({id: d.id, type: 'workout_session', ...d.data()})); refresh(); }));
            unsubscribers.push(onSnapshot(collection(db, 'workout_logs'), s => { legacyLogs = s.docs.map(d => ({id: d.id, type: d.data().type ?? 'workout_session', ...d.data()})); refresh(); }));
            unsubscribers.push(onSnapshot(collection(db, 'sleep_logs'), s => { sleepLogs = s.docs.map(d => ({id: d.id, type: 'sleep', ...d.data()})); refresh(); }));
            unsubscribers.push(onSnapshot(collection(db, 'weight_logs'), s => { weightLogs = s.docs.map(d => ({id: d.id, type: 'weight', ...d.data()})); refresh(); }));
        }

        window.renderCalendar = (logs) => {
            const grid = document.getElementById('calendarGrid');
            const now = new Date();
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            document.getElementById('calendarMonthLabel').innerText = new Intl.DateTimeFormat('en-US', { month: 'short', year: 'numeric' }).format(currentCalendarDate);

            const daysData = {};
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            for(let i=1; i<=daysInMonth; i++) daysData[i] = { workout: false, dietBreak: false, sleep: null, weight: null };

            // logs are sorted descending; first match per day = most recent
            logs.forEach(log => {
                const logDate = getLogDate(log.timestamp);
                if (logDate.getFullYear() === year && logDate.getMonth() === month) {
                    const day = logDate.getDate();
                    if (log.type === 'workout_session') daysData[day].workout = true;
                    if (log.type === 'diet') daysData[day].dietBreak = true;
                    if (log.type === 'sleep' && daysData[day].sleep === null) daysData[day].sleep = log.hours;
                    if (log.type === 'weight' && daysData[day].weight === null) daysData[day].weight = log.weight;
                }
            });

            const cells = [];
            for (let i = 0; i < new Date(year, month, 1).getDay(); i++) cells.push('<div></div>');
            for (let i = 1; i <= daysInMonth; i++) {
                const d = daysData[i];
                const isToday = (i === now.getDate() && month === now.getMonth() && year === now.getFullYear()) ? 'ring-2 ring-primary ring-offset-1' : '';
                const indicators = [
                    d.dietBreak ? '<span class="absolute top-0.5 right-0.5 w-1.5 h-1.5 rounded-full bg-negative"></span>' : '',
                    d.sleep !== null ? `<span class="absolute bottom-0.5 left-0.5 text-[7px] leading-none text-blue-600 font-semibold">${d.sleep}</span>` : '',
                    d.weight !== null ? `<span class="absolute bottom-0.5 right-0.5 text-[7px] leading-none text-purple-600 font-semibold">${d.weight}</span>` : ''
                ].join('');
                cells.push(`<div class="relative flex items-center justify-center h-10 rounded-lg border ${d.workout ? 'bg-emerald-100 border-emerald-300 text-emerald-800' : 'bg-slate-100 border-slate-200 text-slate-400'} ${isToday} text-sm font-medium">${i}${indicators}</div>`);
            }
            grid.innerHTML = cells.join('');
        };

        let isSavingDiet = false;
        window.saveDietBreak = async () => {
            const desc = document.getElementById('dietDesc').value.trim();
            if (!desc || !currentUser || isSavingDiet) return;
            isSavingDiet = true;
            try {
                await addDoc(collection(db, 'diet_breaks'), { description: desc, userId: currentUser.uid, timestamp: serverTimestamp() });
                closeDietModal();
                showToast("Diet break recorded");
            } catch(e) { showToast("DB Error: " + e.message); }
            finally { isSavingDiet = false; }
        };

        let isSavingWorkout = false;
        window.saveWorkoutSession = async () => {
            if (isSavingWorkout) return;
            const ex = [];
            workouts.forEach(w => {
                if (w.type === 'single') {
                    const v = parseFloat(document.getElementById(`input-${w.id}`).value);
                    if (v > 0 && isFinite(v)) ex.push({ id: w.id, name: w.name, value: v, unit: w.unit });
                } else {
                    const wt = parseFloat(document.getElementById(`weight-${w.id}`).value);
                    const r = parseInt(document.getElementById(`reps-${w.id}`).value);
                    if (wt > 0 && isFinite(wt) && r > 0 && isFinite(r)) ex.push({ id: w.id, name: w.name, weight: wt, reps: r });
                }
            });
            if (!ex.length) return showToast("Enter at least one exercise.");
            isSavingWorkout = true;
            try {
                await addDoc(collection(db, 'workouts'), { exercises: ex, userId: currentUser.uid, timestamp: serverTimestamp() });
                workouts.forEach(w => {
                    if (w.type === 'single') document.getElementById(`input-${w.id}`).value = '';
                    else { document.getElementById(`weight-${w.id}`).value = ''; document.getElementById(`reps-${w.id}`).value = ''; }
                });
                showToast("Workout saved!");
            } catch (e) { showToast("DB Error: " + e.message); }
            finally { isSavingWorkout = false; }
        };

        let isSavingSleep = false;
        window.saveSleepLog = async () => {
            const hours = parseFloat(document.getElementById('sleepInput').value);
            if (!isFinite(hours) || hours <= 0 || !currentUser || isSavingSleep) return showToast("Enter valid sleep hours.");
            isSavingSleep = true;
            try {
                await addDoc(collection(db, 'sleep_logs'), { hours, userId: currentUser.uid, timestamp: serverTimestamp() });
                document.getElementById('sleepInput').value = '';
                showToast("Sleep logged!");
            } catch(e) { showToast("DB Error: " + e.message); }
            finally { isSavingSleep = false; }
        };

        let isSavingWeight = false;
        window.saveWeightLog = async () => {
            const weight = parseFloat(document.getElementById('weightInput').value);
            if (!isFinite(weight) || weight <= 0 || !currentUser || isSavingWeight) return showToast("Enter valid weight.");
            isSavingWeight = true;
            try {
                await addDoc(collection(db, 'weight_logs'), { weight, userId: currentUser.uid, timestamp: serverTimestamp() });
                document.getElementById('weightInput').value = '';
                showToast("Weight logged!");
            } catch(e) { showToast("DB Error: " + e.message); }
            finally { isSavingWeight = false; }
        };

        window.changeMonth = (d) => {
            currentCalendarDate = new Date(currentCalendarDate.getFullYear(), currentCalendarDate.getMonth() + d, 1);
            renderCalendar(currentLogs);
            updateMonthlySummary(currentLogs);
        };
        window.resetCalendar = () => { currentCalendarDate = new Date(); renderCalendar(currentLogs); updateMonthlySummary(currentLogs); };
        window.showToast = (m) => { const t = document.getElementById('toast'); t.textContent = m; t.classList.remove('hidden'); setTimeout(() => t.classList.add('hidden'), 3000); };
        window.openDietModal = () => { document.getElementById('dietModal').classList.remove('hidden'); document.getElementById('dietDesc').focus(); };
        window.closeDietModal = () => { document.getElementById('dietModal').classList.add('hidden'); document.getElementById('dietDesc').value = ''; };

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDietModal(); });

        onAuthStateChanged(auth, u => { currentUser = u; if (u) setupRealtimeLogs(); });
        initUI();
        signInAnonymously(auth);
    </script>
</body>
</html>
